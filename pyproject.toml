[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-data-platform"
version = "0.1.0"
description = "Durable, incremental commerce data ingestion"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "google-auth[requests]>=2.37,<3", "prefect>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["commerce_data*", "apps*", "flows*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires CDIP_TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src", "apps", "flows"]

[tool.ruff.lint.per-file-ignores]
"apps/api/main.py" = ["B008"]
"apps/api/ui.py" = ["B008"]
"apps/api/business.py" = ["B008"]
"db/migrations/versions/*.py" = ["E501"]

[tool.setuptools.package-data]
"apps.api" = ["static/*"]
